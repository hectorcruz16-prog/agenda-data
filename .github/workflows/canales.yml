name: Canales por país (Wikipedia)
on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: canales
jobs:
  canales:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests==2.32.3
      - run: python scripts/canales.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Guardar si cambió
        run: |
          git config user.name "agenda-robot"
          git config user.email "agenda-robot@users.noreply.github.com"
          git add data/rights.json
          if ! git diff --cached --quiet; then
            git commit -m "canales $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main || true
            git push
          fi
